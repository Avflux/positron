name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior. Com três jobs que não
# são rápidos, rodar duplicado não se paga.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: Python (sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/sidecar/uv.lock

      - name: Instalar dependências
        run: uv sync --directory services/sidecar --group dev

      - name: Lint
        run: uv run --directory services/sidecar ruff check .

      # Sobe ROUTER/PUB e um DEALER/SUB de verdade. Se isso passa, o protocolo fecha.
      - name: Testes (round-trip ZMQ real)
        run: uv run --directory services/sidecar pytest -q

  web:
    name: TypeScript (UI + protocolo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` exige package-lock.json versionado — sem ele, a resolução de
      # dependências mudaria entre builds.
      - run: npm ci

      # Precisa do `uv`: a fonte da verdade do contrato está no Python.
      - uses: astral-sh/setup-uv@v5

      - name: Contrato Python <-> TS em sincronia
        run: npm run protocol:gen

      - run: npm run typecheck
      - run: npm run build:web

  desktop:
    name: Rust (shell Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O `tauri-build` valida o `frontendDist` durante o build.rs, então os
      # estáticos do web precisam existir antes do `cargo check`.
      - run: npm ci
      - run: npm run build:web

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # libwebkit2gtk/gtk: dependências do Tauri no Linux.
      # cmake: a feature `vendored` do crate `zmq` compila o libzmq junto.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake

      # Este é o gate que importa: compilar. É onde erros de tipo e de API do
      # Tauri aparecem.
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Formatação NÃO é gate de CI de propósito: um `cargo fmt --check` vermelho
      # misturado com um `cargo check` vermelho faz perder tempo com o que é
      # cosmético. Rode `npm run fmt:rust --workspace @app/desktop` quando quiser.
